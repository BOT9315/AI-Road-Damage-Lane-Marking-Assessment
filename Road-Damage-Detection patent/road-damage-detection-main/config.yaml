# =========================================================
# AI-Powered Road Damage Detection - Central Configuration
# =========================================================

project:
  name: "road-damage-detection"
  seed: 42
  device: "cpu"          # "cuda", "cpu", or "mps"

# ---------------------------------------------------------
# Dataset configuration
# Compatible with RDD2022 (Road Damage Dataset) style data,
# or any custom pothole/crack dataset converted to YOLO format.
# ---------------------------------------------------------
dataset:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  annotations_dir: "data/annotations"
  train_split: 0.75
  val_split: 0.15
  test_split: 0.10
  img_size: 640

  # Damage classes (RDD2022 standard taxonomy)
  classes:
    0: "D00_longitudinal_crack"
    1: "D10_transverse_crack"
    2: "D20_alligator_crack"
    3: "D40_pothole"
    4: "D43_crosswalk_blur"
    5: "D44_whiteline_blur"

  # Severity buckets derived from bbox area / class type
  severity_levels: ["Low", "Medium", "High", "Critical"]

# ---------------------------------------------------------
# Model configuration
# ---------------------------------------------------------
model:
  architecture: "yolov8"       # yolov8n/s/m/l/x
  variant: "yolov8s.pt"        # pretrained starting weights
  num_classes: 6
  pretrained: true
  export_formats: ["onnx", "torchscript"]

# ---------------------------------------------------------
# Training hyperparameters
# ---------------------------------------------------------
train:
  epochs: 100
  batch_size: 16
  img_size: 640
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  patience: 20              # early stopping
  optimizer: "SGD"          # SGD, Adam, AdamW
  augment: true
  mosaic: 1.0
  mixup: 0.1
  save_dir: "models/runs"

# ---------------------------------------------------------
# Inference configuration
# ---------------------------------------------------------
inference:
  conf_threshold: 0.35
  iou_threshold: 0.45
  max_detections: 100
  weights_path: "yolov8s.pt"

# ---------------------------------------------------------
# Evaluation
# ---------------------------------------------------------
evaluate:
  metrics: ["precision", "recall", "mAP50", "mAP50-95", "f1"]
  report_dir: "outputs/eval_reports"
